services:
  caneta-database:
    image: postgres:18.3

    environment:
      POSTGRES_DB: canetasdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

    ports:
      - "5433:5432"

    volumes:
      - caneta_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d canetasdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  caneta_data:
