spring.application.name=catalogo-canetas-api

spring.profiles.default=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Autenticacao (troque em producao, de preferencia via variaveis de ambiente:
# APP_SECURITY_USUARIO, APP_SECURITY_SENHA, APP_SECURITY_JWT_SECRET)
app.security.usuario=admin
app.security.senha=admin123
app.security.jwt.secret=troque-esta-chave-secreta-por-uma-bem-grande-com-no-minimo-32-bytes
app.security.jwt.expiration-minutes=60
